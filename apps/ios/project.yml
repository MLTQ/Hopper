name: Hopper
options:
  bundleIdPrefix: app.hopper
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    REGISTER_APP_GROUPS: YES
targets:
  Hopper:
    type: application
    platform: iOS
    sources:
      - path: Hopper
        excludes: ["**/*.md"]
      - path: Shared
        excludes: ["**/*.md"]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Hopper/Hopper.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.hopper.player.ios
        INFOPLIST_FILE: Hopper/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Hopper/Hopper-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/include"
        OTHER_LDFLAGS: ["-lresolv"]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    dependencies:
      - target: HopperShare
        embed: true
      - framework: build/HopperCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
  HopperShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HopperShare
        excludes: ["**/*.md"]
      - path: Shared
        excludes: ["**/*.md"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hopper.player.ios.share
        INFOPLIST_FILE: HopperShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: HopperShare/HopperShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
